version = "3.7.14"

# Column width
maxColumn = 120

# Scala version
runner.dialect = scala213

# ========================================
# Alignment
# ========================================

align.preset = most
align.multiline = true
align.arrowEnumeratorGenerator = true
align.openParenCallSite = false
align.openParenDefnSite = false

align.tokens = [
  { code = "=>", owner = "Case" }
  { code = "->", owner = "Term.ApplyInfix" }
  { code = ":", owner = "(Enumerator.Val|Defn.(Va(l|r)|Def|Type))" }
  { code = "=", owner = "(Enumerator.Val|Defn.(Va(l|r)|Def|Type))" }
  { code = "extends", owner = "Defn.(Class|Trait|Object)" }
  { code = "with", owner = "(Defn.(Class|Trait|Object)|Template)" }
  { code = "<-", owner = "Enumerator.Generator" }
  { code = "//", owner = ".*" }
]

# ========================================
# Indentation
# ========================================

continuationIndent.callSite = 2
continuationIndent.defnSite = 2
continuationIndent.extendSite = 2

indent.main = 2
indent.significant = 2
indent.callSite = 2
indent.ctrlSite = 2
indent.defnSite = 2
indent.caseSite = 2
indent.extendSite = 2
indent.withSiteRelativeToExtends = 0

# ========================================
# Newlines
# ========================================

newlines.source = keep
newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]

newlines.beforeCurlyLambdaParams = multiline
newlines.afterCurlyLambdaParams = preserve
newlines.implicitParamListModifierPrefer = before
newlines.avoidForSimpleOverflow = [tooLong, punct, slc]

# Keep newlines in multiline method definitions
newlines.beforeMultiline = keep
newlines.alwaysBeforeElseAfterCurlyIf = false
newlines.sometimesBeforeColonInMethodReturnType = false

# ========================================
# Vertical Alignment & Spacing
# ========================================

verticalMultiline.atDefnSite = true
verticalMultiline.arityThreshold = 3
verticalMultiline.newlineAfterOpenParen = true

# ========================================
# Docstrings
# ========================================

docstrings.style = Asterisk
docstrings.oneline = keep
docstrings.wrap = no
docstrings.blankFirstLine = yes

# ========================================
# Spaces
# ========================================

spaces.inImportCurlyBraces = false
spaces.inInterpolatedStringCurlyBraces = false
spaces.afterKeywordBeforeParen = true
spaces.inByNameTypes = true
spaces.afterSymbolicDefs = false

# ========================================
# Trailing Commas
# ========================================

trailingCommas = always

# ========================================
# Rewrite Rules
# ========================================

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortModifiers,
  PreferCurlyFors,
  Imports
]

rewrite.redundantBraces.maxLines = 1
rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantBraces.generalExpressions = false

# Sort imports
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [
  ["java\\..*"],
  ["scala\\..*"],
  ["com\\.multipart\\..*"],
  [".*"]
]
rewrite.imports.contiguousGroups = no

# ========================================
# Comments
# ========================================

comments.wrap = trailing
comments.wrapStandaloneSlcAsSlc = true

# ========================================
# Optional Braces (Scala 3)
# ========================================

# Not using Scala 3 optional braces for Scala 2.13
runner.dialectOverride.allowSignificantIndentation = false

# ========================================
# Line Endings
# ========================================

lineEndings = unix

# ========================================
# Project-specific settings
# ========================================

# Don't break before opening curly brace
optIn.breakChainOnFirstMethodDot = true
optIn.configStyleArguments = true

# Break long parameter lists
optIn.annotationNewlines = true

# Format embedded strings
assumeStandardLibraryStripMargin = true
